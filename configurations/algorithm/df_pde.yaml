defaults:
  - df_base

# dataset info
data_save_dir: None
data_mean: null
data_std: null
observation_shape: ${dataset.observation_shape}
observation_mean: ${dataset.observation_mean}
observation_std: ${dataset.observation_std}
control_mean: ${dataset.control_mean}
control_std: ${dataset.control_std}
episode_len: ${dataset.episode_len}
rescaler: ${dataset.rescaler}

# non dataset info
x_shape: null
frame_stack: 1
frame_skip: 1
# data_mean: ${dataset.data_mean}
# data_std: ${dataset.data_std}
external_cond_dim: 128
context_frames: 1

open_loop_horizon: 50 #fixme
diffusion_edit_level: 0
causal: False
plot_start_goal: True
padding_mode: same

# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
# diffusion-related
guidance_scale: 2.0
chunk_size: ${dataset.episode_len}
scheduling_matrix: pyramid

diffusion:
  stabilization_level: 10
  beta_schedule: linear
  objective: pred_x0
  ddim_sampling_eta: 0.0

  architecture:
    network_size: 128
    num_layers: 12
    attn_heads: 4
    dim_feedforward: 512